openapi: 3.1.0
info:
  title: Railpay merchant API
  version: 3.0.0
  description: |
    How a merchant's server takes card payments. Authenticate with your secret key:
    `Authorization: Bearer sk_test_...`. Card details never reach your server: the hosted card form gives your
    page a token (`tok_...`), which you pass as `source`.

    Version 3 adds step-up: when the card's bank wants the cardholder to confirm a payment (as with 3-D Secure),
    the payment waits as `requires_action` with a `nextAction` page to show the shopper (in a frame or a new window);
    when the page says it's done, call `POST /payments/{id}/confirm`. Version 2 declines such payments instead.
    Versions 1 and 2 stay as they were.

    Writes accept an `Idempotency-Key` header. A request repeated with the same key and body gets the first
    answer, with `Idempotent-Replayed: true`, and is never done twice.

    Errors are RFC 9457 problems with a stable `code`.

    Webhooks: if you give Railpay a webhook URL, each change to a payment or refund is POSTed to it as an event,
    until your server answers 2xx (with growing gaps, for up to three days). Each is signed:
    `Railpay-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256 of "t.body" with your webhook secret>`. Check the
    signature, refuse a `t` more than five minutes old, and use the event `id` to ignore a repeat.
servers:
  - url: https://cards-saiworks.nncs.in/api/railpay/v3
paths:
  /payments:
    post:
      operationId: createPayment
      summary: Authorise a card payment
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePayment'
      responses:
        '201':
          description: |
            The payment, authorised or declined (a decline is a payment with its reason), or unknown when the
            network didn't answer in time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listPayments
      summary: Your most recent payments, newest first
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: A page of payments
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { const: list }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Problem' }
  /payments/{id}/capture:
    post:
      operationId: capturePayment
      summary: Capture an authorised payment, all of it or part
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                amount: { type: integer, minimum: 1, maximum: 99999999, description: 'Default: all that was authorised' }
      responses:
        '200':
          description: The captured payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /payments/{id}/confirm:
    post:
      operationId: confirmPayment
      summary: After the shopper confirmed with their bank, authorise the payment again with the proof. Safe to repeat.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: The payment, authorised or captured, or declined if the cardholder didn't confirm it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /payments/{id}/void:
    post:
      operationId: voidPayment
      summary: Cancel an authorised payment before capture, releasing the cardholder's hold
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The voided payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /payments/{id}/refunds:
    post:
      operationId: refundPayment
      summary: Give money back on a captured payment, all that is left or part
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                amount: { type: integer, minimum: 1, maximum: 99999999, description: 'Default: all that is left' }
      responses:
        '201':
          description: The refund. Pending means its answer was lost; a webhook says how it ended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /disputes:
    get:
      operationId: listDisputes
      summary: Chargebacks against your payments, newest first
      responses:
        '200':
          description: A page of disputes
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { const: list }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Dispute' }
        '401': { $ref: '#/components/responses/Problem' }
  /disputes/{id}:
    get:
      operationId: getDispute
      summary: One dispute
      parameters:
        - $ref: '#/components/parameters/DisputeId'
      responses:
        '200':
          description: The dispute
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /disputes/{id}/evidence:
    post:
      operationId: answerDispute
      summary: Answer a dispute with evidence; the cardholder's bank decides
      parameters:
        - $ref: '#/components/parameters/DisputeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [evidence]
              properties:
                evidence: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: The dispute, now under review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /disputes/{id}/accept:
    post:
      operationId: acceptDispute
      summary: Accept a dispute; the cardholder keeps the money
      parameters:
        - $ref: '#/components/parameters/DisputeId'
      responses:
        '200':
          description: The dispute, lost
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /payouts:
    get:
      operationId: listPayouts
      summary: What you were paid, newest first; each is everything settled since the one before, less fees and chargebacks
      responses:
        '200':
          description: A page of payouts
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { const: list }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Payout' }
        '401': { $ref: '#/components/responses/Problem' }
  /payments/{id}:
    get:
      operationId: getPayment
      summary: One payment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^pay_' }
      responses:
        '200':
          description: The payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
webhooks:
  event:
    post:
      summary: What happened to one of your payments or refunds
      parameters:
        - name: Railpay-Signature
          in: header
          required: true
          schema: { type: string }
        - name: Railpay-Event-Id
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Event' }
      responses:
        '200': { description: Received. Any 2xx stops retries. }
components:
  parameters:
    PaymentId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^pay_' }
    DisputeId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^dsp_' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 255 }
  responses:
    Problem:
      description: An RFC 9457 problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CreatePayment:
      type: object
      additionalProperties: false
      required: [amount, currency, source]
      properties:
        amount:
          type: integer
          minimum: 1
          maximum: 99999999
          description: In the smallest unit of the currency (cents)
        currency:
          type: string
          enum: [usd]
        source:
          type: string
          pattern: '^tok_'
          description: A card token from the hosted card form. Usable once.
        description:
          type: string
          maxLength: 200
        capture:
          type: boolean
          default: true
          description: Capture as soon as it is authorised. False to capture (or void) it later.
    Payment:
      type: object
      required: [id, object, amount, currency, status, card, reference, createdAt]
      properties:
        id: { type: string, pattern: '^pay_' }
        object: { const: payment }
        amount: { type: integer }
        currency: { type: string }
        status:
          type: string
          enum: [pending, requires_action, authorised, declined, unknown, failed, captured, voided, reversed]
          description: |
            authorised: approved and held, not yet captured. captured: the merchant takes it at the next clearing.
            unknown: the network didn't answer in time; it is being reversed, and becomes reversed.
        card:
          type: object
          required: [brand, last4]
          properties:
            brand: { type: string }
            last4: { type: string, pattern: '^[0-9]{4}$' }
        reference:
          type: string
          pattern: '^[A-Za-z0-9]{12}$'
          description: The retrieval reference number every party knows this payment by (ISO 8583 field 37)
        authCode: { type: string, description: The issuer's approval code }
        responseCode: { type: string, description: The ISO 8583 response code (field 39) }
        declineReason: { type: string }
        description: { type: string }
        capture: { type: boolean }
        amountCaptured: { type: integer }
        amountRefunded: { type: integer }
        refunds:
          type: array
          items: { $ref: '#/components/schemas/Refund' }
        nextAction:
          type: object
          description: Only while the status is requires_action
          required: [type, url]
          properties:
            type: { const: authenticate }
            url: { type: string, description: "The card's bank's page; add ?origin=<your page's origin> to be told when it's done" }
        createdAt: { type: string, format: date-time }
    Refund:
      type: object
      required: [id, object, amount, status, reference, payment, createdAt]
      properties:
        id: { type: string, pattern: '^re_' }
        object: { const: refund }
        amount: { type: integer }
        status: { type: string, enum: [pending, succeeded, failed] }
        reference: { type: string, pattern: '^[A-Za-z0-9]{12}$' }
        failureReason: { type: string }
        payment: { type: string, pattern: '^pay_' }
        createdAt: { type: string, format: date-time }
    Event:
      type: object
      required: [id, object, type, createdAt, data]
      properties:
        id: { type: string, pattern: '^evt_' }
        object: { const: event }
        type:
          type: string
          enum: [payment.authorised, payment.declined, payment.captured, payment.voided, payment.reversed,
                 refund.succeeded, refund.failed, dispute.created, dispute.won, dispute.lost, payout.paid]
        createdAt: { type: string, format: date-time }
        data:
          oneOf:
            - $ref: '#/components/schemas/Payment'
            - $ref: '#/components/schemas/Refund'
            - $ref: '#/components/schemas/Dispute'
            - $ref: '#/components/schemas/Payout'
    Dispute:
      type: object
      required: [id, object, payment, amount, reason, reasonCode, status, createdAt]
      properties:
        id: { type: string, pattern: '^dsp_' }
        object: { const: dispute }
        payment: { type: string, pattern: '^pay_' }
        amount: { type: integer }
        reason: { type: string, description: The reason in plain words }
        reasonCode: { type: string, description: 'The network reason code: 1040 fraud, 1310 not received, 1330 not as described, 1240 charged twice' }
        status:
          type: string
          enum: [needs_response, under_review, won, lost]
        createdAt: { type: string, format: date-time }
    Payout:
      type: object
      required: [id, object, amount, sales, refunds, fees, disputes, createdAt]
      properties:
        id: { type: string, pattern: '^po_' }
        object: { const: payout }
        amount: { type: integer, description: 'Paid to you: sales - refunds - fees - disputes' }
        sales: { type: integer }
        refunds: { type: integer }
        fees: { type: integer, description: The merchant discount (MDR) on the sales }
        disputes: { type: integer, description: Chargebacks less those you won back }
        createdAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [status, code, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        requestId: { type: string }
