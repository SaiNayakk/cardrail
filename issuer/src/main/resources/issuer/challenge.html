<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm your payment</title>
<style>
  :root { --ink: #1c1c1e; --muted: #6b6b70; --line: #d8d8dc; --accent: #0f766e; --bad: #b3261e; --bg: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #ececf0; --muted: #a0a0a8; --line: #3a3a40; --bg: #18181b; --bad: #f2b8b5; --accent: #5eead4; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  .bank { font-size: 14px; color: var(--accent); font-weight: 600; margin: 0 0 8px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 12px; color: var(--muted); }
  .amount { color: var(--ink); font-weight: 600; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 0 0 4px; }
  input { width: 100%; padding: 12px; font: inherit; letter-spacing: 4px; color: inherit; background: transparent;
          border: 1px solid var(--line); border-radius: 8px; transition: border-color 150ms ease-out; }
  input:focus { outline: none; border-color: var(--accent); }
  button { margin-top: 12px; width: 100%; padding: 12px; font: inherit; color: var(--bg); background: var(--accent); border: 0;
           border-radius: 8px; cursor: pointer; transition: opacity 150ms ease-out; }
  button:disabled { opacity: 0.6; cursor: default; }
  .error { min-height: 24px; margin: 8px 0 0; font-size: 14px; color: var(--bad); }
  .done { color: var(--ink); }
</style>
</head>
<body>
<p class="bank">Kestrel Bank</p>
<h1>Confirm this payment</h1>
<p id="what">Loading…</p>
<form id="form" novalidate>
  <label for="code">Code from your Kestrel Bank app</label>
  <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
  <button id="go" type="submit">Confirm</button>
  <p class="error" id="error" role="alert"></p>
</form>
<p>You can also approve it in the app. Open the cardholder app on another tab to see the code.</p>
<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search);
  var parentOrigin = params.get("origin");
  var base = location.pathname;
  var form = document.getElementById("form");
  var code = document.getElementById("code");
  var error = document.getElementById("error");
  var what = document.getElementById("what");
  var go = document.getElementById("go");

  function dollars(cents) { return "$" + (cents / 100).toFixed(2); }

  function finish(status) {
    form.hidden = true;
    what.className = "done";
    what.textContent = status === "Y" ? "Confirmed. You can close this." : "Not confirmed. The payment won't go through.";
    if (parentOrigin) { parent.postMessage({ type: "cardrail:authentication", id: base.split("/").pop(), status: status }, parentOrigin); }
  }

  function poll() {
    fetch(base + "/info").then(function (r) { return r.json(); }).then(function (info) {
      if (info.status && info.status !== "PENDING") { finish(info.status); return; }
      what.innerHTML = "";
      what.append("Pay ", Object.assign(document.createElement("span"), { className: "amount", textContent: dollars(info.amountCents) }),
        " to " + info.merchant + "?");
      setTimeout(poll, 2000);   // approved in the app meanwhile?
    }).catch(function () { what.textContent = "We couldn't reach Kestrel Bank. Try again."; });
  }

  code.addEventListener("input", function () { code.value = code.value.replace(/\D/g, "").slice(0, 6); });
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    error.textContent = "";
    if (code.value.length !== 6) { error.textContent = "Enter the 6-digit code."; return; }
    go.disabled = true;
    fetch(base, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: code.value }) })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
      .then(function (r) {
        go.disabled = false;
        if (!r.ok) { error.textContent = r.body.detail || "That didn't work."; code.select(); return; }
        finish(r.body.status);
      })
      .catch(function () { go.disabled = false; error.textContent = "We couldn't reach Kestrel Bank. Try again."; });
  });
  poll();
})();
</script>
</body>
</html>
