# The phone's cardrail edge (started by start.sh as nginx -p ~/cardrail/edge -c ~/cardrail/nginx.conf). Its one
# server, written by edge.sh from the web app's template, listens on 127.0.0.1:8280 for the tunnel connector.
worker_processes 1;
pid nginx.pid;
error_log logs/error.log warn;

events {
    worker_connections 256;
}

http {
    include /data/data/com.termux/files/usr/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    include edge/server.conf;
}
